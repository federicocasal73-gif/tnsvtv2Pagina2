security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # TNSVT Reino v2: SINGLE firewall with 3 chained authenticators.
        # Priority order is the order they appear in `custom_authenticators`:
        #   1° JwtAuthenticator        — reads Authorization: Bearer
        #   2° LegacyHeaderAuthenticator — reads X-Game-Code (backcompat)
        #   3° CodeAuthenticator        — reads PHP session
        main:
            lazy: true
            stateless: false
            provider: app_user_provider
            custom_authenticators:
                - App\Security\JwtAuthenticator
                - App\Security\LegacyHeaderAuthenticator
                - App\Security\CodeAuthenticator
            entry_point: App\Security\JwtAuthenticator
            logout:
                path: /api/auth/logout

    access_control:
        # Public endpoints
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/refresh, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/check, roles: PUBLIC_ACCESS }
        - { path: ^/api/health, roles: PUBLIC_ACCESS }
        - { path: ^/api/mercadopago/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/binance-pay/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/link-preview/preview, roles: PUBLIC_ACCESS }
        # Sanctum admin panel
        - { path: ^/sanctum, roles: ROLE_ADMIN }
        - { path: ^/trono, roles: ROLE_ADMIN }
        # Everything else under /api requires authentication
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10