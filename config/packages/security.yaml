security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            id: App\Security\UserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\JwtAuthenticator
                - App\Security\CodeAuthenticator
            # Logout path removed — AuthController::logout handles it directly to
            # return a JSON response instead of Symfony's default 302 redirect
            entry_point: App\Security\CodeAuthenticator

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/check, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/og, roles: PUBLIC_ACCESS }
        - { path: ^/api/music/stream, roles: PUBLIC_ACCESS }
        - { path: ^/api/music/playlist, roles: PUBLIC_ACCESS }
        - { path: ^/api/music, roles: PUBLIC_ACCESS }
        - { path: ^/api/devices, roles: PUBLIC_ACCESS }
        - { path: ^/api/notifications, roles: PUBLIC_ACCESS }
        - { path: ^/api/feed, roles: PUBLIC_ACCESS }
        - { path: ^/api/chat, roles: PUBLIC_ACCESS }
        - { path: ^/api/tasks, roles: PUBLIC_ACCESS }
        - { path: ^/api/academia, roles: PUBLIC_ACCESS }
        - { path: ^/api/frequencies/presets, roles: PUBLIC_ACCESS }
        # Admin-only Sanctum sub-routes. The catch-all ^/sanctum below opens the
        # rest (notably /sanctum/dashboard, which HomeController redirects every
        # authenticated user to). Fix for the 403 that blocked regular users.
        - { path: ^/sanctum/(users|audit|tasks|settings|monitoring), roles: ROLE_ADMIN }
        - { path: ^/api/sanctum, roles: ROLE_ADMIN }
        - { path: ^/sanctum, roles: ROLE_USER }
        # User account personal preferences (Phase 7 — settings split).
        - { path: ^/account/settings, roles: ROLE_USER }
        - { path: ^/, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10