# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Trust the Hostinger reverse proxy so IP-based rate limiters see the real
    # client IP via X-Forwarded-For. Without this, every request appears to
    # come from the proxy itself and ALL rate limiters become ineffective.
    # TRUSTED_PROXIES is a comma-separated list of CIDR ranges or IPs.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-prefix']

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        trusted_proxies: '127.0.0.1,REMOTE_ADDR'