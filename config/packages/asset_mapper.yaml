framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        # Re-declared here only to keep missing_import_mode tight in dev.
        paths:
            - src/assets
        # tailwind.css is a build INPUT for the Tailwind CLI (resolves the
        # npm package, which asset-map can't). Only the committed OUTPUT
        # (tailwind-utilities.css) is served. Never link tailwind.css.
        excluded_patterns:
            - '*/tailwind.css'
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
