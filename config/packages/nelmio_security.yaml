nelmio_security:
    # Clickjacking protection: deny all embedding in iframes
    clickjacking:
        paths:
            '^/': DENY

    # MIME sniffing protection
    content_type:
        nosniff: true

    # Forced SSL + HSTS in one block.
    # Disabled in test (HTTP requests would 302-redirect).
    # Re-enabled in prod via when@prod below.
    forced_ssl:
        enabled: false
        hsts_max_age: 31536000
        hsts_subdomains: true
        hsts_preload: false

    # Content Security Policy
    # NOTE: 'unsafe-inline' in script-src is required because we have ~30 inline
    # <script> blocks across sanctum pages. Future work: migrate to nonce-based
    # CSP via Symfony's "csp_nonce" helper (requires removing all inline scripts).
    csp:
        enabled: true
        enforce:
            default-src: ["'self'"]
            script-src:
                - "'self'"
                - "'unsafe-inline'"
                - 'https://cdn.jsdelivr.net'
            style-src:
                - "'self'"
                - "'unsafe-inline'"
                - 'https://fonts.googleapis.com'
            font-src:
                - "'self'"
                - 'https://fonts.gstatic.com'
                - 'data:'
            img-src:
                - "'self'"
                - 'data:'
                - 'blob:'
                - 'https:'
            connect-src:
                - "'self'"
                - 'https://*.hostingersite.com'
                - 'https://tnsvt.com'
            object-src: ["'none'"]
            frame-ancestors: ["'none'"]
            base-uri: ["'self'"]
            form-action: ["'self'"]
            upgrade-insecure-requests: true

    # Referrer policy
    referrer_policy:
        enabled: true
        policies:
            - 'strict-origin-when-cross-origin'

    # Permissions policy: disable unused browser features
    permissions_policy:
        enabled: true
        policies:
            accelerometer: []
            autoplay: []
            camera: []
            display-capture: []
            fullscreen: ['self']
            geolocation: []
            gyroscope: []
            magnetometer: []
            microphone: []
            payment: []
            picture-in-picture: []
            usb: []

when@prod:
    nelmio_security:
        forced_ssl:
            enabled: true

when@test:
    nelmio_security:
        forced_ssl:
            enabled: false