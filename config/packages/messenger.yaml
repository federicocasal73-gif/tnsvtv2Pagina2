framework:
    messenger:
        # Failed messages get stored for retry
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            # Chat messages go async (don't block HTTP request)
            'App\Message\ChatMessageSent': async
            'App\Message\NotificationDispatch': async
            'App\Message\TournamentNotification': async
            'App\Message\DeviceRegistered': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                failed: 'in-memory://'