mercure:
    default_hub: default

    hubs:
        default:
            # URL where the Mercure hub is running
            # - Local dev: run `mercure` binary on port 3000
            # - Production: deploy mercure separately, e.g., https://mercure.tnsvt.com/.well-known/mercure
            url: '%env(MERCURE_URL)%'
            # JWT used to publish (default is shared with subscribe for dev)
            jwt:
                secret: '%env(MERCURE_JWT_SECRET)%'
                # Symfony Mercure 0.x → 1.x renamed the algorithm identifiers from
                # JWS-style ("HS256") to lcobucci/JWT-style ("hmac.sha256").
                # The old name now throws InvalidArgumentException at boot —
                # confirmed by /api/health/mercure returning 503 with this exact
                # error. Keep in sync with vendor/symfony/mercure/Jwt/LcobucciFactory.php.
                algorithm: hmac.sha256