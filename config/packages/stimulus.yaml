# stimulus-bundle busca por defecto assets/controllers y assets/controllers.json.
# Como en este deploy las fuentes del asset mapper viven en src/assets (fuera del
# doc root servido, para que public/assets == /assets/ solo contenga compilados),
# apuntamos el controlador y el json de estímulos a su nueva ubicación.
stimulus:
    controller_paths:
        - '%kernel.project_dir%/src/assets/controllers'
    controllers_json: '%kernel.project_dir%/src/assets/controllers.json'