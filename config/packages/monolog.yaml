monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                # Audit AUDIT-2026-09-28 #1: en Hostinger shared, php://stderr no se captura.
                # Volcamos a archivo rotado (diario, 14 dias) para tener post-mortem real.
                # Sentry (sentry.yaml) sigue siendo el camino primario si SENTRY_DSN esta seteado.
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                level: debug
                max_files: 14
                filename_format: '{filename}-{date}'
                date_format: 'Y-m-d'
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: rotating_file
                channels: [deprecation]
                path: "%kernel.logs_dir%/deprecation.log"
                max_files: 30
                filename_format: '{filename}-{date}'
                date_format: 'Y-m-d'
                formatter: monolog.formatter.json
