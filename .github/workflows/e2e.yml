# GitHub Actions workflow: e2e
# Runs the Playwright suite against the production site on every push
# to main and on every PR. Production is intentional — see playwright.config.ts
# for the rationale (no staging env, proc_open disabled on Hostinger).
#
# Required secrets:
#   TNSVT_ADMIN_CODE       — admin user code (e.g. "ADMIN01")
#   TNSVT_ADMIN_PASSWORD   — admin password
# These are read by tests/e2e/login.ts. We do NOT bake them into repo.
#
# Jobs:
#   1. e2e-chromium-prod   — full suite on prod (single worker, retries=1)
#   2. e2e-report          — always-on summary posted to the Actions run
name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # manual trigger for ad-hoc runs

# Cancel in-flight runs on the same ref to save CI minutes.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-chromium-prod:
    name: E2E (chromium → prod)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TNSVT_BASE_URL: https://www.tnsvt.com
      TNSVT_ADMIN_CODE: ${{ secrets.TNSVT_ADMIN_CODE }}
      TNSVT_ADMIN_PASSWORD: ${{ secrets.TNSVT_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14

      - name: Comment on PR with failure summary
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '❌ E2E suite failed. See [the GitHub Actions run]('
                  + '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) '
                  + 'for the report and screenshots.'
            });

  e2e-report:
    name: E2E summary
    runs-on: ubuntu-latest
    needs: e2e-chromium-prod
    if: always()
    steps:
      - name: Post run summary
        run: |
          echo "### E2E run ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ needs.e2e-chromium-prod.result }}" >> $GITHUB_STEP_SUMMARY
