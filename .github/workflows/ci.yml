name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    APP_ENV: test
    DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
    MESSENGER_TRANSPORT_DSN: "in-memory://"
    MERCURE_URL: "http://127.0.0.1:3000/.well-known/mercure"
    MERCURE_JWT_SECRET: "ci-test-mercure-secret-32bytes-placeholder"
    TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"

jobs:
    lint-php:
        name: PHPStan (Static Analysis)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Generate JWT keys
              run: |
                  mkdir -p config/jwt var
                  if [ ! -f config/jwt/private.pem ]; then
                      openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
                      openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem 2>/dev/null
                  fi
              env:
                  JWT_PASSPHRASE: ''

            - name: Setup database
              env:
                  JWT_PASSPHRASE: ''
              run: |
                  mkdir -p var
                  php bin/console cache:warmup --env=test --no-debug
                  php bin/console cache:warmup --env=dev
                  php bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Run PHPStan
              env:
                  JWT_PASSPHRASE: ''
              run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Generate OpenAPI spec
              env:
                  JWT_PASSPHRASE: ''
              run: |
                  php bin/console openapi:generate
                  php bin/console lint:yaml config/packages/sentry.yaml

    tests:
        name: PHPUnit (Tests)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, sqlite
                  coverage: xdebug

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Generate JWT keys
              run: |
                  mkdir -p config/jwt var
                  if [ ! -f config/jwt/private.pem ]; then
                      openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
                      openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem 2>/dev/null
                  fi
              env:
                  JWT_PASSPHRASE: ''

            - name: Setup database
              env:
                  JWT_PASSPHRASE: ''
              run: |
                  mkdir -p var
                  php bin/console cache:warmup --env=test --no-debug
                  php bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Run tests
              env:
                  JWT_PASSPHRASE: ''
              run: php vendor/bin/phpunit --coverage-text --colors=never

            - name: Upload coverage
              if: matrix.coverage != false
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.php-versions }}
                  path: var/coverage

    lint-twig:
        name: Twig Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Lint templates
              run: php bin/console lint:twig templates

            - name: Compile asset map (Stimulus controllers)
              # Guards against shipping new controllers/ that never reach
              # public/assets (see campus admin users panel incident).
              env:
                  JWT_PASSPHRASE: ''
              run: php bin/console asset-map:compile --no-interaction

    lint-js:
        name: ESLint + Prettier (JS/CSS)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install deps
              run: npm ci --no-audit

            - name: ESLint
              run: npm run lint

            - name: Prettier check
              run: npm run format:check

            - name: Stylelint
              run: npm run stylelint

            - name: JS Syntax (standalone .js files)
              # Belt-and-suspenders: catch the class of bug where a file
              # lacks the 'export default' that ESLint expects.
              run: find src/assets/controllers src/assets/js -name '*.js' -print0 | xargs -0 -n 1 node --check

            - name: Inline <script> Syntax (Twig templates)
              # Lints <script>…</script> bodies without Twig tags inside
              # templates via bin/lint-inline-js.py (kept out of YAML so the
              # heredoc can't break the workflow file again). Catches the
              # class of bug where an edit leaves template JS unparseable
              # (lint:twig only validates Twig syntax, not the JS inside).
              run: python3 bin/lint-inline-js.py templates

    a11y-axe:
        name: axe-core (a11y)
        runs-on: ubuntu-latest
        needs: lint-php
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install deps
              run: npm ci --no-audit

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run axe-core tests
              run: npm run test:a11y

    lighthouse:
        name: Lighthouse CI (perf + a11y + SEO)
        runs-on: ubuntu-latest
        needs: lint-php
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install deps
              run: npm ci --no-audit

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run Lighthouse CI
              run: npm run lighthouse

    security-audit:
        name: Composer Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'

            - name: Audit
              run: composer audit --no-interaction --format=json | jq '.vulnerabilities | length'

    lint-entity-migrations:
        name: Lint Entity↔Migration Coherence
        # Catches the class of bug we hit with the 12-table prod incident:
        # a new #[ORM\Entity] shipped without a corresponding CREATE TABLE
        # in any migration. Without this check the entity passes local
        # sqlite tests (doctrine:schema:create mirrors the entity layer)
        # but throws 42S02 in prod. See RISK_MITIGATION.md § Risk #3.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Run entity-migrations lint
              run: php bin/console app:lint:entity-migrations --no-interaction

    messenger-consumer:
        name: Messenger Consumer Smoke Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, sqlite

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Generate JWT keys
              run: |
                  mkdir -p config/jwt var
                  if [ ! -f config/jwt/private.pem ]; then
                      openssl genrsa -out config/jwt/private.pem 2048 2>/dev/null
                      openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem 2>/dev/null
                  fi
              env:
                  JWT_PASSPHRASE: ''

            - name: Setup database
              env:
                  JWT_PASSPHRASE: ''
              run: |
                  php bin/console cache:warmup --env=test --no-debug
                  php bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Dispatch test message
              env:
                  JWT_PASSPHRASE: ''
              run: |
                  php bin/console messenger:setup-transports --no-interaction || true

            - name: Consume messages (5s smoke test)
              env:
                  JWT_PASSPHRASE: ''
              run: timeout 5 php bin/console messenger:consume async --time-limit=5 -vv || true
