name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    APP_ENV: test
    DATABASE_URL: "sqlite:///%kernel.project_dir%/var/test.db"
    MESSENGER_TRANSPORT_DSN: "in-memory://"
    MERCURE_URL: "http://127.0.0.1:3000/.well-known/mercure"
    MERCURE_JWT_SECRET: "ci-test-mercure-secret-32bytes-placeholder"
    TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
    MP_ACCESS_TOKEN: "TEST-FAKE-TOKEN-FOR-SIGNATURE-VERIFICATION-ONLY"
    MP_WEBHOOK_SECRET: "test_webhook_secret_for_signing_verification"

jobs:
    lint-php:
        name: PHPStan (Static Analysis)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup database
              run: |
                  mkdir -p var
                  bin/console doctrine:database:create --if-not-exists --no-interaction
                  bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Run PHPStan
              run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            - name: Generate OpenAPI spec
              run: |
                  php bin/console openapi:generate
                  php bin/console lint:yaml config/packages/sentry.yaml

    tests:
        name: PHPUnit (Tests)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, sqlite
                  coverage: xdebug

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup database
              run: |
                  mkdir -p var
                  bin/console doctrine:database:create --if-not-exists --no-interaction
                  bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Run tests
              run: php vendor/bin/phpunit --coverage-text --colors=never

            - name: Upload coverage
              if: matrix.coverage != false
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-${{ matrix.php-versions }}
                  path: var/coverage

    lint-twig:
        name: Twig Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Lint templates
              run: |
                  find templates -name '*.twig' -print0 | xargs -0 -I {} bin/console lint:twig {}

    lint-js:
        name: JS Syntax Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: JS Syntax
              run: |
                  find assets/controllers -name '*.js' -print0 | xargs -0 -n 1 node --check

    security-audit:
        name: Composer Security Audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'

            - name: Audit
              run: composer audit --no-interaction --format=json | jq '.vulnerabilities | length'

    messenger-consumer:
        name: Messenger Consumer Smoke Test
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, sqlite

            - name: Install dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Setup database
              run: |
                  bin/console doctrine:database:create --if-not-exists --no-interaction
                  bin/console doctrine:schema:create --no-interaction
                  php bin/setup-messenger-db.php

            - name: Dispatch test message
              run: |
                  php bin/console messenger:setup-transports --no-interaction || true

            - name: Consume messages (5s smoke test)
              run: timeout 5 php bin/console messenger:consume async --time-limit=5 -vv || true