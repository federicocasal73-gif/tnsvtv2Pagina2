name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            echo "→ Pulling latest code..."
            cd ~/domains/tnsvt.com/public_html
            git pull origin main
            echo "→ Installing PHP deps..."
            composer install --no-dev --optimize-autoloader --no-interaction
            echo "→ Running migrations..."
            php bin/console doctrine:migrations:migrate --no-interaction || php bin/console doctrine:schema:update --force --complete || true
            php bin/console app:seed-achievements --no-interaction || true
            echo "→ Clearing cache & compiling assets..."
            php bin/console cache:clear --env=prod || true
            php bin/console asset-map:compile --env=prod || true
            echo "✓ Deploy done"
